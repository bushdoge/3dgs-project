# Streamlit テーマ設定（全ページ共通）
# 「黒+水色」のAI定番配色をやめ、温かみのあるインクブルー×コーラルに。
# アクセント候補: コーラル#ff8552 / ミント#7ee8b2 / ゴールド#ffd166 / スカイ#8ab8e8 / ラベンダー#b7a5ff

[theme]
base = "dark"
primaryColor = "#ff8552"             # コーラル: ボタン・スライダー・フォーカス
backgroundColor = "#151a24"          # インクブルー（真っ黒より柔らかい）
secondaryBackgroundColor = "#1f2733" # サイドバー・入力欄・カード
textColor = "#eae6dc"                # 温かいオフホワイト（青白より目に優しい）
linkColor = "#8ab8e8"
font = "sans serif"

[server]
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false
